<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pres AI · Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    h2.sec { margin: 48px 0 14px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .card { padding: 20px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); }
    .quote { padding: 12px 14px; border-radius: 10px; background: var(--bg); font-size: 15px; }
    .moment { display: grid; grid-template-columns: 64px 100px 1fr; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid #1f2326; font-size: 15px; }
    .badge { justify-self: start; padding: 2px 8px; border-radius: 999px; font: 500 11px var(--mono); border: 1px solid currentColor; }
  </style>
</head>
<body>
  <header style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;border-bottom:1px solid var(--raised-2)">
    <a href="/" class="logo"><span class="logo-mark"></span>Pres AI</a>
    <div style="display:flex;gap:8px">
      <a href="/setup.html" class="btn-ghost" style="padding:10px 16px;font-size:14px">New session</a>
      <button id="again" class="btn-mint" style="padding:10px 18px;font-size:14px">Run it again</button>
    </div>
  </header>
  <main style="width:100%;max-width:960px;margin:0 auto;padding:44px 28px 72px">
    <div id="meta" class="mono" style="font-size:12px;color:var(--muted);letter-spacing:.06em"></div>
    <h1 style="margin:10px 0 0;font-size:40px;font-weight:800;letter-spacing:-0.03em">Report card</h1>
    <p id="caveats" style="margin:10px 0 0;font-size:13px;line-height:1.5;color:var(--faint);max-width:680px"></p>
    <section id="dimensions" style="margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px"></section>
    <section id="metrics" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px"></section>
    <h2 class="sec">Recovery</h2>
    <div id="curveballs" style="display:flex;flex-direction:column;gap:10px"></div>
    <h2 class="sec">Key moments</h2>
    <ol id="moments" style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column"></ol>
    <h2 class="sec">What to fix next time</h2>
    <div id="improvements" style="display:flex;flex-direction:column;gap:10px"></div>
    <h2 class="sec">From the audience</h2>
    <div id="personas" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px"></div>
  </main>
  <script type="module" src="/js/report.js"></script>
</body>
</html>
