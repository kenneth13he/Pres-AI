<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pres AI · Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    body { height: 100vh; display: flex; flex-direction: column; }
    .room-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--raised-2); }
    .room-grid { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
    @media (max-width: 900px) { .room-grid { grid-template-columns: 1fr; } .captions-pane { border-left: 0 !important; border-top: 1px solid var(--raised-2); max-height: 50vh !important; } }
    #stage { border-radius: 16px; border: 1px solid #1f2326; max-height: calc(100vh - 170px); }
    #stage .slide { border-radius: 1cqw; overflow: hidden; background: #181b1e; border: 1px solid #2c3134; transition: opacity .4s; }
    #stage .slide img { width: 100%; height: 100%; object-fit: contain; }
    #stage.dim .slide { opacity: .15; }
    #stage .black { border-radius: 1cqw; background: #050606; display: grid; place-items: center; text-align: center; opacity: 0; pointer-events: none; transition: opacity .4s; }
    #stage.black .black { opacity: 1; }
    #cb-pill { left: 50%; top: 3%; transform: translate(-50%, -12px); padding: .6cqw 1.4cqw; border-radius: 999px; background: var(--coral); color: var(--coral-ink); font: 600 max(10px, 1.1cqw) var(--mono); opacity: 0; white-space: nowrap; z-index: 2; }
    #cb-pill.show { opacity: 1; transform: translate(-50%, 0); }
    .veil { inset: 0; background: rgba(8,9,10,.7); display: grid; place-items: center; z-index: 3; }
    .cap-who { font-size: 13px; font-weight: 700; }
    .cap-tag { padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; font: 500 10px var(--mono); }
    .end-btn { padding: 9px 16px; border-radius: 10px; border: 0; background: var(--raised-3); font-size: 14px; font-weight: 700; cursor: pointer; }
    .end-btn.done { background: var(--mint); color: var(--mint-ink); }
  </style>
</head>
<body>
  <header class="room-head">
    <div style="display:flex;align-items:center;gap:12px">
      <a href="/" title="Pres AI" class="logo-mark" style="width:16px;height:16px;border-radius:5px"></a>
      <span id="room-name" style="font-size:15px;font-weight:700">Room</span>
      <span id="guest-count" style="font-size:14px;color:var(--muted);white-space:nowrap"></span>
      <span id="phase" class="phase-pill">setup</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <div id="timer" class="mono" style="font-size:24px;font-weight:500;min-width:84px;text-align:right">00:00</div>
      <div style="display:flex;gap:6px">
        <button id="btn-restore" class="hidden" style="padding:9px 14px;border-radius:10px;border:0;background:var(--coral);color:var(--coral-ink);font-size:14px;font-weight:700;cursor:pointer">Restore slides</button>
        <button id="btn-pause" class="btn-sq" title="P">Pause</button>
        <button id="btn-skip" class="btn-sq" title="S">Skip</button>
        <button id="btn-end" class="end-btn">End → Q&amp;A</button>
      </div>
    </div>
  </header>
  <div class="room-grid">
    <section style="padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0">
      <div id="stage" class="stage"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px">
          <button id="prev" style="width:34px;height:30px;border-radius:8px;border:1px solid var(--border-input);background:var(--surface);cursor:pointer">←</button>
          <span id="slide-no" style="min-width:96px;text-align:center">Slide 1</span>
          <button id="next" style="width:34px;height:30px;border-radius:8px;border:1px solid var(--border-input);background:var(--surface);cursor:pointer">→</button>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span id="mic-label">mic</span>
          <div class="meter"><div id="mic-level"></div></div>
        </div>
      </div>
    </section>
    <aside class="captions-pane" style="border-left:1px solid var(--raised-2);display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 62px)">
      <div style="padding:16px 18px;border-bottom:1px solid var(--raised-2);display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:15px;font-weight:700">Live captions</span>
        <span id="cb-left" class="mono" style="font-size:12px;color:var(--muted)"></span>
      </div>
      <div id="captions" style="flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px"></div>
      <div style="padding:12px 18px;border-top:1px solid var(--raised-2);font-size:12px;line-height:1.5;color:var(--faint)">Personas are fictional · Pause and Skip are never scored against you · ←/→ slides, P pause, S skip · <span id="conn">connecting…</span></div>
    </aside>
  </div>
  <audio id="sfx" preload="auto"></audio>
  <script type="module" src="/js/room.js"></script>
</body>
</html>
